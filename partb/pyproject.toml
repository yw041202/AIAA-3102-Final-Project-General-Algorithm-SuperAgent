[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superagent-partb"
version = "0.1.0"
description = "Config-driven data loading and train-only preprocessing"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2", "pandas>=2,<4", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "Pillow>=10,<13", "joblib>=1.3,<2"]

[tool.setuptools]
packages = ["partb", "partb.examples"]
package-dir = {partb = "."}

[tool.setuptools.package-data]
partb = ["configs/*.json"]
